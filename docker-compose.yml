version: "3.8"

services:
  # MySQL Database
  mysql-db:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mysql_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - newtiffino-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      timeout: 20s
      retries: 5
      interval: 20s

  # Eureka Server
  eureka-server:
    image: rutujapawar2003/eureka-server:latest
    container_name: eureka-server
    ports:
      - "8990:8990"
    networks:
      - newtiffino-network
    restart: on-failure

  # API Gateway
  api-gateway:
    image: rutujapawar2003/api-gateway:latest
    container_name: api-gateway
    depends_on:
      - eureka-server
    ports:
      - "8800:8800"
    networks:
      - newtiffino-network
    restart: on-failure

  # delivery-service
  delivery-service:
    image: rutujapawar2003/delivery-service:latest
    container_name: delivery-service
    ports:
      - "8970:8970"
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/deliverydb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - newtiffino-network
    restart: on-failure

  # loyalty-service
  loyalty-service:
    image: rutujapawar2003/loyalty-service:latest
    container_name: loyalty-service
    ports:
      - "8940:8940"
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/loyaltydb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - newtiffino-network
    restart: on-failure

  # menu-service
  menu-service:
    image: rutujapawar2003/menu-service:latest
    container_name: menu-service
    ports:
      - "8920:8920"
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/dummymenudb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - newtiffino-network
    restart: on-failure

  # notification-service
  notification-service:
    image: rutujapawar2003/notification-service:latest
    container_name: notification-service
    ports:
      - "8980:8980"
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/notificationdb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - newtiffino-network
    restart: on-failure
  
  # order-service
  order-service:
    image: rutujapawar2003/order-service:latest
    container_name: order-service
    ports:
      - "8910:8910"
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/orderdb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - newtiffino-network
    restart: on-failure

  # payment-service
  payment-service:
    image: rutujapawar2003/payment-service:latest
    container_name: payment-service
    ports:
      - "8930:8930"
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/paymentdb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - newtiffino-network
    restart: on-failure
  
  # review-service
  review-service:
    image: rutujapawar2003/review-service:latest
    container_name: review-service
    ports:
      - "8950:8950"
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/reviewdb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - newtiffino-network
    restart: on-failure

  # subscription-service
  subscription-service:
    image: rutujapawar2003/subscription-service:latest
    container_name: subscription-service
    ports:
      - "8960:8960"
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/subscriptiondb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - newtiffino-network
    restart: on-failure

  # userservice
  userservice:
    image: rutujapawar2003/userservice:latest
    container_name: userservice
    ports:
      - "8890:8890"
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/userdbfinal?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - newtiffino-network
    restart: on-failure

  # Frontend
  frontend:
    image: rutujapawar2003/frontend:latest
    container_name: tiffino-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - newtiffino-network
    restart: on-failure

networks:
  newtiffino-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
